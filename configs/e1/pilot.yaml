# E1 schema-v2 pilot protocol. IVEBench is intentionally excluded.
protocol_schema_version: "2"
dataset: DAVIS-2017
split: train
seeds: [101, 202, 303, 404, 505]
randomization_seed: 20260820

dev_samples: [bear-white, dog-tiger, hiker-backpack]
frozen_eval_samples:
  - bus-red
  - elephant-pink
  - classic-car-blue
  - horse-zebra
  - mallard-swan
  - rider-helmet
  - car-headlights

methods:
  absolute-v1:
    requests: 50
    prompt: prompt-absolute-v1.yaml
    swap: false
  pairwise-single-v1:
    requests: 100
    prompt: prompt-pairwise-single-v1.yaml
    swap: false
  pairwise-swap-v1:
    requests: 200
    prompt: prompt-pairwise-swap-v1.yaml
    swap: true
  rubric-swap-v1:
    requests: 200
    prompt: prompt-rubric-swap-v1.yaml
    swap: true
total_requests: 550

thresholds:
  accuracy: 0.70
  swap_consistency: 0.85
  high_confidence_coverage: 0.60
  min_category_accuracy: 0.60
threshold_grids:
  confidence: [0.5, 0.6, 0.7, 0.8, 0.9]
  absolute_delta: [0.0, 0.25, 0.5, 0.75, 1.0]
method_selection:
  candidates: [pairwise-swap-v1, rubric-swap-v1]
  rubric_tie_tolerance: 0.01

bootstrap_seed: 20260820
bootstrap_iterations: 2000
