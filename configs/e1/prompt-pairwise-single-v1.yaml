schema_version: "2"
prompt_version: pairwise-single-v1
method: pairwise-single-v1
parser_version: "2"
status: development
created_from_commit: 8d651bc052a73417d074489794d664f4c11244d0
visual_roles: [source, candidate_a, candidate_b]
system_prompt: |-
  You are a strict evaluator of instruction-based video editing. Compare A and B against
  the source across all 16 frames. Return one JSON object only and ignore screen position.
user_template: |-
  Instruction: $instruction
  Target caption: $target_caption
  Select the better overall edit. Faithfulness cannot be replaced by attractiveness;
  preservation must be judged against the source; temporal stability requires all frames.
  Return uncertain when evidence is insufficient and tie only when quality is genuinely close.
output_schema:
  overall_preference: "a|b|tie|uncertain"
  confidence: "number 0..1"
  evidence: string
generation_parameters:
  do_sample: false
  max_new_tokens: 256
  max_pixels: 65536
  fps: 8.0
